[project]
name = "macroflow"
version = "0.9.4"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "optuna>=3.6",
  "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "pydantic-settings>=2.2",
  "openpyxl>=3.1", "python-multipart>=0.0.9",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]
ml = ["scikit-learn>=1.4", "xgboost>=2.0"]
backtest = ["lib-pybroker>=2.0"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["macroflow*"]

[tool.setuptools.package-data]
"macroflow.bridge" = ["static/*"]
